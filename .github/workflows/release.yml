name: Release

# Builds a signed release APK + AAB on a version tag (e.g. v1.1) or on demand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64       base64 of my-upload-key.jks
#                         (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("my-upload-key.jks")))
#   STORE_PASSWORD        keystore password
#   KEY_PASSWORD          key password (same as store unless you changed it)
#   SUPABASE_URL          -> written to .env
#   SUPABASE_ANON_KEY     -> written to .env
#   GOOGLE_WEB_CLIENT_ID  -> written to .env
#   GOOGLE_SERVICES_JSON  optional; full contents of app/google-services.json.
#                         Without it the build succeeds but FCM is inert.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
          } > .env

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON is not set - building without FCM configuration."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rabwa-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: rabwa-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
